name: BZGram
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 30
    MARKETING_VERSION: 1.0.24
    DEVELOPMENT_TEAM: "2P5Z4JVY8W"
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Release: release
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.63-8ff05a0e
targets:
  BZGramCore:
    type: framework
    platform: iOS
    sources:
      - path: BZGram/Sources/Core
    dependencies:
      - package: TDLibKit
    info:
      path: BZGram/BZGramCore-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_NAME: BZGramCore
        PRODUCT_MODULE_NAME: BZGramCore
        PRODUCT_BUNDLE_IDENTIFIER: com.pixian5.bzgram.core
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  BZGram:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BZGram/Sources/App
      - path: BZGram/Sources/Views
    dependencies:
      - target: BZGramCore
    info:
      path: BZGram/Info.plist
      properties:
        BZGRAM_TELEGRAM_API_ID: "28071027"
        BZGRAM_TELEGRAM_API_HASH: "449cf3df8937bb8c31bdd4a610a25a5a"
        BZGRAM_TELEGRAM_USE_TEST_DC: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationCategoryType: public.app-category.social-networking
        CFBundleDisplayName: BZGram
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: BZGram
        PRODUCT_MODULE_NAME: BZGram
        PRODUCT_BUNDLE_IDENTIFIER: com.pixian5.bzgramapp.v2
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - BZGramTests
      gatherCoverageData: true
  BZGramTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BZGram/Tests
    dependencies:
      - target: BZGramCore
    settings:
      base:
        PRODUCT_NAME: BZGramTests
        PRODUCT_MODULE_NAME: BZGramTests
        PRODUCT_BUNDLE_IDENTIFIER: com.pixian5.bzgram.tests
